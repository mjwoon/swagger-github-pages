---
openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Announcements
  description: 공지사항 API
- name: Files
  description: 파일 업로드 API
- name: Auth
  description: 인증 API
paths:
  "/api/announcements/{id}":
    get:
      tags:
      - Announcements
      summary: 공지사항 상세 조회
      operationId: getDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
    put:
      tags:
      - Announcements
      summary: 공지사항 수정
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
    delete:
      tags:
      - Announcements
      summary: 공지사항 삭제
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/announcements/{id}/unpin":
    put:
      tags:
      - Announcements
      summary: 공지사항 핀 해제
      operationId: unpin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/announcements/{id}/pin":
    put:
      tags:
      - Announcements
      summary: 공지사항 핀 고정
      operationId: pin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/files":
    post:
      tags:
      - Files
      summary: 파일 업로드
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseListFileResponse"
  "/api/auth/register":
    post:
      tags:
      - Auth
      summary: 회원가입
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/auth/refresh":
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseTokenResponse"
  "/api/auth/logout":
    post:
      tags:
      - Auth
      summary: 로그아웃
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/auth/login":
    post:
      tags:
      - Auth
      summary: 로그인
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseTokenResponse"
  "/api/announcements":
    get:
      tags:
      - Announcements
      summary: 공지사항 목록 조회
      operationId: getList
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/Pageable"
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponsePageResponseAnnouncementSummary"
    post:
      tags:
      - Announcements
      summary: 공지사항 작성
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
  "/api/files/{filename}":
    get:
      tags:
      - Files
      summary: 파일 다운로드 (로컬 저장소 전용)
      operationId: download
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: binary
  "/api/announcements/pinned":
    get:
      tags:
      - Announcements
      summary: 핀 고정 공지사항 목록
      operationId: getPinned
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseListAnnouncementSummary"
components:
  schemas:
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        content:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        isImportant:
          type: boolean
      required:
      - category
      - content
      - title
    AnnouncementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          type: string
        writer:
          type: string
        isImportant:
          type: boolean
        viewCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseAnnouncementResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/AnnouncementResponse"
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    ApiResponseListFileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/FileResponse"
    FileResponse:
      type: object
      properties:
        originalFilename:
          type: string
        storedFilename:
          type: string
        fileUrl:
          type: string
        fileSize:
          type: integer
          format: int64
        contentType:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        name:
          type: string
          minLength: 1
        department:
          type: string
        studentId:
          type: string
      required:
      - email
      - name
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    ApiResponseTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/TokenResponse"
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    AnnouncementSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponsePageResponseAnnouncementSummary:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/PageResponseAnnouncementSummary"
    PageResponseAnnouncementSummary:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/AnnouncementSummary"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
    ApiResponseListAnnouncementSummary:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/AnnouncementSummary"
