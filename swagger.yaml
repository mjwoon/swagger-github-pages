    "/api/files": {
      "post": {
        "tags": [
          "Files"
        ],
        "summary": "파일 업로드",
        "description": "entityType(ANNOUNCEMENT/INQUIRY/EVENT)과 entityId를 함께 전달하면 DB에 첨부파일 연결 레코드가 저장됩니다.",
        "operationId": "upload",
        "parameters": [
          {
            "name": "entityType",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "ANNOUNCEMENT",
                "INQUIRY",
                "EVENT"
              ]
            }
          },
          {
            "name": "entityId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "files": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "format": "binary"
                    }
                  }
                },
                "required": [
                  "files"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ApiResponseListAttachmentResponse"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ]
      }
    },
