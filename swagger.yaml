---
openapi: 3.1.0
info:
  title: HYEnd API
  description: |
    HYEnd 웹사이트 백엔드 REST API 명세서

    ## 인증 방법
    1. `/api/auth/login` 으로 로그인하여 `accessToken` 발급
    2. 우측 상단 **Authorize** 버튼 클릭 후 토큰 입력
    3. 이후 인증이 필요한 API에 Bearer 토큰 자동 포함
  contact:
    name: HYEnd Team
    email: jwmoon@hanyang.ac.kr
  version: v1.0.0
servers:
- url: http://localhost:8080
  description: 로컬 개발 서버
tags:
- name: Announcements
  description: 공지사항 API
- name: Files
  description: 파일 업로드 API
- name: Auth
  description: 인증 API
paths:
  "/api/inquiries/{inquiryId}":
    get:
      tags:
      - inquiry-controller
      operationId: getInquiry
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: requesterId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InquiryResponse"
    put:
      tags:
      - inquiry-controller
      operationId: updateInquiry
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: requesterId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InquiryResponse"
    delete:
      tags:
      - inquiry-controller
      operationId: deleteInquiry
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: requesterId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  "/api/events/{id}":
    get:
      tags:
      - event-controller
      operationId: getEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/EventResponse"
    put:
      tags:
      - event-controller
      operationId: updateEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/EventResponse"
    delete:
      tags:
      - event-controller
      operationId: deleteEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  "/api/announcements/{id}":
    get:
      tags:
      - Announcements
      summary: 공지사항 상세 조회
      operationId: getDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
    put:
      tags:
      - Announcements
      summary: 공지사항 수정
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Announcements
      summary: 공지사항 삭제
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
      security:
      - bearerAuth: []
  "/api/announcements/{id}/unpin":
    put:
      tags:
      - Announcements
      summary: 공지사항 핀 해제
      operationId: unpin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
      security:
      - bearerAuth: []
  "/api/announcements/{id}/pin":
    put:
      tags:
      - Announcements
      summary: 공지사항 핀 고정
      operationId: pin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
      security:
      - bearerAuth: []
  "/api/inquiries":
    post:
      tags:
      - inquiry-controller
      operationId: createInquiry
      parameters:
      - name: authorId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InquiryResponse"
  "/api/inquiries/{inquiryId}/replies":
    get:
      tags:
      - inquiry-controller
      operationId: getReplies
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: requesterId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ReplyResponse"
    post:
      tags:
      - inquiry-controller
      operationId: createReply
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: authorId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReplyRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ReplyResponse"
  "/api/files":
    post:
      tags:
      - Files
      summary: 파일 업로드
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseListFileResponse"
      security:
      - bearerAuth: []
  "/api/events":
    get:
      tags:
      - event-controller
      operationId: getAllEvents
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/EventResponse"
    post:
      tags:
      - event-controller
      operationId: createEvent
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/EventResponse"
  "/api/categories":
    get:
      tags:
      - category-controller
      operationId: getAllCategories
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CategoryResponse"
    post:
      tags:
      - category-controller
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CategoryResponse"
  "/api/books/return/{rentalId}":
    post:
      tags:
      - book-controller
      operationId: returnBook
      parameters:
      - name: rentalId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  "/api/books/rent":
    post:
      tags:
      - book-controller
      operationId: rentBook
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RentRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/RentalResponse"
  "/api/auth/register":
    post:
      tags:
      - Auth
      summary: 회원가입
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
  "/api/auth/refresh":
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseTokenResponse"
  "/api/auth/logout":
    post:
      tags:
      - Auth
      summary: 로그아웃
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseVoid"
      security:
      - bearerAuth: []
  "/api/auth/login":
    post:
      tags:
      - Auth
      summary: 로그인
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseTokenResponse"
  "/api/announcements":
    get:
      tags:
      - Announcements
      summary: 공지사항 목록 조회
      operationId: getList
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/Pageable"
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponsePageResponseAnnouncementSummary"
    post:
      tags:
      - Announcements
      summary: 공지사항 작성
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseAnnouncementResponse"
      security:
      - bearerAuth: []
  "/api/inquiries/{inquiryId}/close":
    patch:
      tags:
      - inquiry-controller
      operationId: closeInquiry
      parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  "/api/inquiries/me":
    get:
      tags:
      - inquiry-controller
      operationId: getMyInquiries
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/InquiryResponse"
  "/api/files/{filename}":
    get:
      tags:
      - Files
      summary: 파일 다운로드 (로컬 저장소 전용)
      operationId: download
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: binary
  "/api/categories/{name}":
    get:
      tags:
      - category-controller
      operationId: getCategoryByName
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CategoryResponse"
  "/api/books":
    get:
      tags:
      - book-controller
      operationId: getAllBooks
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/BookResponse"
  "/api/books/{id}":
    get:
      tags:
      - book-controller
      operationId: getBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/BookResponse"
  "/api/books/overdue/{rentalId}":
    get:
      tags:
      - book-controller
      operationId: isOverdue
      parameters:
      - name: rentalId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: boolean
  "/api/announcements/pinned":
    get:
      tags:
      - Announcements
      summary: 핀 고정 공지사항 목록
      operationId: getPinned
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseListAnnouncementSummary"
  "/api/categories/{categoryId}":
    delete:
      tags:
      - category-controller
      operationId: deleteCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
components:
  schemas:
    InquiryRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        content:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        isPrivate:
          type: boolean
      required:
      - category
      - content
      - title
    InquiryResponse:
      type: object
      properties:
        inquiryId:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          type: string
        author:
          type: string
    EventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        location:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        author:
          type: string
      required:
      - description
      - title
    EventResponse:
      type: object
      properties:
        eventId:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        content:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        isImportant:
          type: boolean
      required:
      - category
      - content
      - title
    AnnouncementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          type: string
        writer:
          type: string
        isImportant:
          type: boolean
        viewCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseAnnouncementResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/AnnouncementResponse"
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    ReplyRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    ReplyResponse:
      type: object
      properties:
        replyId:
          type: integer
          format: int64
        content:
          type: string
        writer:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiResponseListFileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/FileResponse"
    FileResponse:
      type: object
      properties:
        originalFilename:
          type: string
        storedFilename:
          type: string
        fileUrl:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
          minLength: 0
        description:
          type: string
      required:
      - name
    CategoryResponse:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    RentRequest:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
        email:
          type: string
    RentalResponse:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        category:
          type: string
        isAvailable:
          type: boolean
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        name:
          type: string
          minLength: 1
        department:
          type: string
        studentId:
          type: string
      required:
      - email
      - name
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    ApiResponseTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/TokenResponse"
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    BookResponse:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        category:
          type: string
        summary:
          type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    AnnouncementSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponsePageResponseAnnouncementSummary:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          "$ref": "#/components/schemas/PageResponseAnnouncementSummary"
    PageResponseAnnouncementSummary:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/AnnouncementSummary"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
    ApiResponseListAnnouncementSummary:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/AnnouncementSummary"
  securitySchemes:
    bearerAuth:
      type: http
      description: 로그인 후 발급받은 accessToken 입력 (Bearer 접두사 없이)
      scheme: bearer
      bearerFormat: JWT
